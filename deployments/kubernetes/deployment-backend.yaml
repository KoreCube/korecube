apiVersion: apps/v1
kind: Deployment
metadata:
  name: korecube-backend
  namespace: korecube
  labels:
    app.kubernetes.io/name: korecube
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: korecube
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: korecube
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: korecube
      containers:
        - name: backend
          image: ghcr.io/korecube/korecube:v1.6.0
          imagePullPolicy: IfNotPresent
          args: ["--config", "/app/configs/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GIN_MODE
              value: release
            - name: KORECUBE_CONFIG_PATH
              value: /app/configs/config.yaml
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: korecube-secrets
                  key: JWT_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: korecube-secrets
                  key: ENCRYPTION_KEY
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: korecube-config
        - name: data
          persistentVolumeClaim:
            claimName: korecube-data
