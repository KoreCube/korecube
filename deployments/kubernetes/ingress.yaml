apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: korecube
  namespace: korecube
  labels:
    app.kubernetes.io/name: korecube
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: korecube.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: korecube-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: korecube-frontend
                port:
                  number: 80
