name: Release Helm Chart

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Chart version to publish (e.g. v1.6.0)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  helm:
    name: Package and push chart
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'desktop')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          {
            echo "tag=${TAG}"
            echo "version=${TAG#v}"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Lint
        run: helm lint deployments/helm/korecube

      - name: Package
        run: |
          helm package deployments/helm/korecube \
            --version "${{ steps.meta.outputs.version }}" \
            --app-version "${{ steps.meta.outputs.tag }}" \
            --destination dist

      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/korecube-${{ steps.meta.outputs.version }}.tgz" "oci://ghcr.io/${{ steps.meta.outputs.owner }}/charts"
